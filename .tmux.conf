unbind r
bind r source-file ~/.tmux.conf

set -g prefix C-s
set -g mouse on
set-option -g status-position top
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -g allow-passthrough on
set -g escape-time 0
set -g focus-events on

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Status bar in the Ayu palette, no plugins
set -g status-style "bg=#11151c,fg=#bfbdb6"
set -g status-left-length 40
set -g status-right-length 100
set -g status-left "#[fg=#0b0e14,bg=#e6b450,bold] #S #[default] "
set -g status-right "#[fg=#686868]#{b:pane_current_path} #[fg=#0b0e14,bg=#53bdfa] %H:%M "
set -g window-status-format "#[fg=#686868] #I:#W "
set -g window-status-current-format "#[fg=#e6b450,bold] #I:#W "
set -g pane-border-style "fg=#11151c"
set -g pane-active-border-style "fg=#e6b450"
set -g message-style "bg=#11151c,fg=#e6b450"
