# Global mise config. Rebuild a machine with: mise bootstrap (preview with --dry-run).
# Project-specific tool versions override [tools] via each repo's mise.toml.
# Machine-specific packages live in untracked ~/.config/mise/conf.d/*.toml files.

[tools]
node = "lts"
pnpm = "latest"
jq = "latest"
rpk = "latest"
lazygit = "latest"

[settings]
idiomatic_version_file_enable_tools = ["node"]

# Homebrew formulae and casks. Homebrew itself must be installed first.
[bootstrap.packages]
"brew:betterleaks" = "latest"
"brew:coreutils" = "latest"
"brew:curl" = "latest"
"brew:direnv" = "latest"
"brew:eza" = "latest"
"brew:gh" = "latest"
"brew:git" = "latest"
"brew:git-delta" = "latest"
"brew:gnupg" = "latest"
"brew:mise" = "latest"
"brew:pandoc" = "latest"
"brew:rtk" = "latest"
"brew:starship" = "latest"
"brew:terminal-notifier" = "latest"
"brew:tmux" = "latest"
"brew:yamlfmt" = "latest"
"brew:yazi" = "latest"
"brew:zoxide" = "latest"
"brew-cask:1password" = "latest" # betterleaks:allow (the cask name trips the generic password rule)
"brew-cask:docker-desktop" = "latest"
"brew-cask:font-hack-nerd-font" = "latest"
"brew-cask:font-symbols-only-nerd-font" = "latest"
"brew-cask:google-chrome" = "latest"
"brew-cask:raycast" = "latest"
"brew-cask:slack" = "latest"
"brew-cask:warp" = "latest"

[bootstrap.directories."~/.ssh"]
mode = "0700"

# The bare dotfiles repo keeps its hook and exclude list outside the work tree, so they are declared here.
[bootstrap.files."~/dotfiles/hooks/pre-commit"]
mode = "0755"
content = """
#!/bin/sh
# Block any commit whose staged diff contains a secret.
exec betterleaks git --pre-commit --staged --redact --no-banner --verbose
"""

[bootstrap.files."~/dotfiles/info/exclude"]
content = """
# Machine-specific files that sit next to tracked ones and must never be committed.
.zshrc.local
.gitconfig.local
.ssh/config.local
.claude/CLAUDE.local.md
.config/mise/conf.d/
"""

[bootstrap.macos.defaults]
"NSGlobalDomain" = { AppleInterfaceStyle = "Dark" }
"com.apple.finder" = { FXPreferredViewStyle = "Nlsv" }
"com.apple.dock" = { autohide = true }
"com.apple.screencapture" = { location = "~/Screenshots" }

# Keyboard modifier remaps (System Settings > Keyboard > Modifier Keys), keyed by keyboard vendor-product id.
# HID usages 0x7000000XX: 39 Caps Lock, E0/E4 Control, E2/E6 Option, E3/E7 Command. Log out or replug to apply.

# Built-in keyboard
[[bootstrap.macos.defaults_entries]]
domain = "NSGlobalDomain"
key = "com.apple.keyboard.modifiermapping.0-0-0"
host = "current"
value = [
  { HIDKeyboardModifierMappingSrc = 30064771129, HIDKeyboardModifierMappingDst = 30064771300 },
  { HIDKeyboardModifierMappingSrc = 30064771296, HIDKeyboardModifierMappingDst = 30064771129 },
  { HIDKeyboardModifierMappingSrc = 30064771300, HIDKeyboardModifierMappingDst = 30064771129 },
]

# External keyboard (vendor 0x04D9)
[[bootstrap.macos.defaults_entries]]
domain = "NSGlobalDomain"
key = "com.apple.keyboard.modifiermapping.1241-17733-0"
host = "current"
value = [
  { HIDKeyboardModifierMappingSrc = 30064771303, HIDKeyboardModifierMappingDst = 30064771302 },
  { HIDKeyboardModifierMappingSrc = 30064771296, HIDKeyboardModifierMappingDst = 30064771129 },
  { HIDKeyboardModifierMappingSrc = 30064771302, HIDKeyboardModifierMappingDst = 30064771303 },
  { HIDKeyboardModifierMappingSrc = 30064771298, HIDKeyboardModifierMappingDst = 30064771299 },
  { HIDKeyboardModifierMappingSrc = 30064771300, HIDKeyboardModifierMappingDst = 30064771129 },
  { HIDKeyboardModifierMappingSrc = 30064771129, HIDKeyboardModifierMappingDst = 30064771300 },
  { HIDKeyboardModifierMappingSrc = 30064771299, HIDKeyboardModifierMappingDst = 30064771298 },
]

# Keychron B1 Pro
[[bootstrap.macos.defaults_entries]]
domain = "NSGlobalDomain"
key = "com.apple.keyboard.modifiermapping.13364-1809-0"
host = "current"
value = [
  { HIDKeyboardModifierMappingSrc = 30064771299, HIDKeyboardModifierMappingDst = 30064771298 },
  { HIDKeyboardModifierMappingSrc = 30064771129, HIDKeyboardModifierMappingDst = 30064771300 },
  { HIDKeyboardModifierMappingSrc = 30064771300, HIDKeyboardModifierMappingDst = 30064771129 },
  { HIDKeyboardModifierMappingSrc = 30064771296, HIDKeyboardModifierMappingDst = 30064771129 },
  { HIDKeyboardModifierMappingSrc = 30064771302, HIDKeyboardModifierMappingDst = 30064771303 },
  { HIDKeyboardModifierMappingSrc = 30064771298, HIDKeyboardModifierMappingDst = 30064771299 },
  { HIDKeyboardModifierMappingSrc = 30064771303, HIDKeyboardModifierMappingDst = 30064771302 },
]

[bootstrap.hooks]
post-defaults = "killall Dock || true"

# Runs on every bootstrap, so every step is guarded.
[tasks.bootstrap]
run = [
  "mkdir -p ~/Screenshots ~/.claude ~/.config/mise/conf.d",
  "for f in ~/.zshrc.local ~/.gitconfig.local ~/.ssh/config.local ~/.claude/CLAUDE.local.md; do [ -e \"$f\" ] || touch \"$f\"; done",
  "git --git-dir=\"$HOME/dotfiles\" config status.showUntrackedFiles no",
]
